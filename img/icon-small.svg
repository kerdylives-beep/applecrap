<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The icon for 32px and below: a thicker band, plain cups and three
       wide bars, so it stays crisp in the title bar and taskbar. -->
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7088"/><stop offset="1" stop-color="#ee2340"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3a9d57"/><stop offset="1" stop-color="#8fdc86"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="#141821"/>
  <path d="M270 360 H754 A70 70 0 0 1 824 430 V680 A70 70 0 0 1 754 750 H440 L270 880 L310 750 H270 A70 70 0 0 1 200 680 V430 A70 70 0 0 1 270 360 Z" fill="url(#bubble)"/>
  <path d="M215 560 V470 a297 297 0 0 1 594 0 V560" fill="none" stroke="#f2efea" stroke-width="80" stroke-linecap="round"/>
  <rect x="135" y="455" width="160" height="260" rx="70" fill="#f2efea"/>
  <rect x="729" y="455" width="160" height="260" rx="70" fill="#f2efea"/>
  <g fill="#141821">
    <rect x="352" y="530" width="90" height="140" rx="45"/>
    <rect x="467" y="420" width="90" height="250" rx="45"/>
    <rect x="582" y="480" width="90" height="190" rx="45"/>
  </g>
  <!-- crabapple stem and leaf on the band -->
  <path d="M512 175 C512 130 520 95 540 62" fill="none" stroke="#6b3b2a" stroke-width="56" stroke-linecap="round"/>
  <path d="M548 100 C605 20 730 20 795 55 C740 135 625 155 548 100 Z" fill="url(#leaf)"/>
</svg>
