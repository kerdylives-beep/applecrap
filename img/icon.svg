  <rect x="744" y="470" width="130" height="230" rx="56" fill="#f2efea"/>
  <rect x="185" y="505" width="60" height="160" rx="30" fill="#2a303b"/>
  <rect x="779" y="505" width="60" height="160" rx="30" fill="#2a303b"/>
