<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AppleCrap Now Playing</title>
<style>
  @font-face { font-family: 'Saira Semi Condensed'; font-weight: 600; src: url('/fonts/display-600.woff2') format('woff2'); }
  @font-face { font-family: 'Saira Semi Condensed'; font-weight: 700; src: url('/fonts/display-700.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('/fonts/text-400.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; src: url('/fonts/text-500.woff2') format('woff2'); }

  /* Same palette as the app: warm near-black, amber for music, violet for
     Twitch. With "colors from the album art" on, --accent and --tint follow
     each song's artwork. The page itself is transparent; OBS lays it over
     the scene. Each style is its own address (?style=...), so every OBS
     source draws only the style it shows. */
  :root {
    --card: rgba(18, 17, 20, 0.9);
    --chip: rgba(18, 17, 20, 0.84);
    --line: rgba(255, 255, 255, 0.07);
    --text: #f2efea;
    --muted: #c8c3cc;
    --dim: #8a8591;
    --twitch: #c9beff;
    --twitch-soft: #2a2440;
  }

  #root {
    --accent: #f2a93b;
    --accent-soft: #2b2119;
    --tint: var(--card);
    /* Fixed per style, so a long title never resizes the source in OBS. */
    --width: 520px;
  }

  * { box-sizing: border-box; }

  /* `hidden` must win over the display rules below. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* Preview only (opened from the app): a stand-in for the stream. */
  body.preview {
    min-height: 100vh;
    background:
      linear-gradient(135deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.55)),
      repeating-conic-gradient(#3a4452 0% 25%, #333c48 0% 50%) 0 0 / 32px 32px;
  }

  .preview-note {
    display: none;
    position: fixed;
    right: 16px;
    bottom: 12px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
  }

  body.preview:not(.embedded) .preview-note { display: block; }

  /* Scaled to fit the source for the Card style (see fitStage). */
  #stage { transform-origin: top left; }

  #root {
    width: calc(var(--width) + 40px);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* Hidden until something plays, so an idle scene stays clean. */
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 420ms ease, transform 420ms ease;
  }

  #root.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Parts only some styles use. */
  .backdrop, .hole, .knob, .disc, .pill-fill, .pill-line { display: none; }

  /* ---- Default ------------------------------------------------------------ */

  .card {
    position: relative;
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    align-items: center;
    gap: 14px;
    width: var(--width);
    padding: 12px;
    border-radius: 14px;
    background: var(--tint);
    border: 1px solid var(--line);
    overflow: hidden;
    transition: background-color 600ms ease;
  }

  .art-wrap {
    position: relative;
    width: 76px;
    height: 76px;
  }

  .art {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    object-fit: cover;
    background: var(--accent-soft);
  }

  .art-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 26px 'Saira Semi Condensed', sans-serif;
    color: var(--accent);
  }

  .meta {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .label {
    display: flex;
    align-items: center;
    gap: 7px;
    font: 600 10px 'Saira Semi Condensed', sans-serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  .is-paused .pulse { animation: none; opacity: 0.5; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .title {
    font: 700 23px/1.15 'Saira Semi Condensed', sans-serif;
  }

  .sub {
    font-size: 13px;
    color: var(--muted);
  }

  .sub .who { color: var(--twitch); }
  .sub .sep { color: var(--dim); }

  .points {
    margin-left: 4px;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--twitch-soft);
    color: var(--twitch);
    font-size: 11px;
  }

  /* Text wider than its box drifts to its end and back instead of being
     cut off or stretching the overlay. */
  .marquee {
    overflow: hidden;
    white-space: nowrap;
  }

  .marquee > span {
    display: inline-block;
  }

  /* Fade the edge the text runs off, not the start of the words. */
  .marquee.scrolling {
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent);
    mask-image: linear-gradient(90deg, #000 calc(100% - 18px), transparent);
  }

  .marquee.scrolling > span {
    animation: drift var(--duration, 10s) ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%, 18% { transform: translateX(0); }
    82%, 100% { transform: translateX(var(--shift, 0)); }
  }

  .progress {
    position: relative;
    height: 3px;
    margin-top: 7px;
  }

  .progress-track {
    height: 100%;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: 2px;
    background: var(--accent);
    transition: width 1s linear, background-color 600ms ease;
  }

  /* ---- Compact: the pill is the progress bar ----------------------------- */

  #root[data-style='compact'] { --width: 400px; }

  [data-style='compact'] .card {
    display: block;
    height: 40px;
    padding: 0;
    border-radius: 999px;
    background: var(--card);
  }

  [data-style='compact'] .art-wrap,
  [data-style='compact'] .meta { display: none; }

  [data-style='compact'] .pill-fill {
    display: block;
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    /* The played part, in the song's color; its right edge is the playhead. */
    background: color-mix(in srgb, var(--accent) 42%, rgba(18, 17, 20, 0.9));
    border-right: 2px solid var(--accent);
    transition: width 1s linear, background-color 600ms ease;
  }

  [data-style='compact'] .pill-line {
    display: flex;
    align-items: center;
    position: relative;
    height: 100%;
    padding: 0 20px;
  }

  .pill-line .marquee { width: 100%; }

  .pill-title {
    font: 700 17px 'Saira Semi Condensed', sans-serif;
  }

  .pill-artist {
    margin-left: 8px;
    font: 600 12px 'Saira Semi Condensed', sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---- Card: tall, for Starting Soon / BRB scenes; scales to the source --- */

  #root[data-style='card'] { --width: 360px; }

  [data-style='card'] .card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 16px;
    padding: 20px;
    border-radius: 22px;
    background: rgba(10, 10, 12, 0.55);
  }

  [data-style='card'] .backdrop {
    display: block;
    position: absolute;
    inset: -60px;
    background: var(--tint) center / cover no-repeat;
    background-image: var(--art-url, none);
    filter: blur(34px) saturate(1.3) brightness(0.5);
  }

  [data-style='card'] .art-wrap { width: 100%; height: auto; aspect-ratio: 1; }
  [data-style='card'] .art { border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); }
  [data-style='card'] .art-fallback { font-size: 84px; }
  [data-style='card'] .meta { gap: 3px; }
  [data-style='card'] .title { font-size: 28px; }
  [data-style='card'] .sub { font-size: 14px; }
  [data-style='card'] .progress { margin-top: 14px; }
  [data-style='card'] .progress-track { background: rgba(255, 255, 255, 0.18); }

  [data-style='card'] .knob {
    display: block;
    position: absolute;
    top: 50%;
    left: 0;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85);
    transition: left 1s linear, background-color 600ms ease;
  }

  /* ---- Vinyl: a spinning record with the progress around its edge -------- */

  [data-style='vinyl'] .card {
    display: block;
    height: 132px;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    overflow: visible;
  }

  [data-style='vinyl'] .art-wrap,
  [data-style='vinyl'] .progress { display: none; }

  [data-style='vinyl'] .meta {
    position: absolute;
    left: 66px;
    right: 0;
    top: 22px;
    bottom: 22px;
    justify-content: center;
    padding: 0 16px 0 84px;
    border-radius: 14px;
    background: var(--tint);
    border: 1px solid var(--line);
  }

  [data-style='vinyl'] .disc {
    display: block;
    position: absolute;
    left: 0;
    top: 0;
    width: 132px;
    height: 132px;
    z-index: 1;
  }

  .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* Start at the top and run clockwise, the way the record turns. */
    transform: rotate(-90deg);
  }

  .ring-track { stroke: rgba(255, 255, 255, 0.1); }

  .ring-fill {
    stroke: var(--accent);
    transition: stroke-dasharray 1s linear, stroke 600ms ease;
  }

  .ring-arm {
    position: absolute;
    inset: 0;
    transition: transform 1s linear;
  }

  .ring-arm .knob {
    display: block;
    position: absolute;
    left: 60px;
    top: -1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85);
  }

  .record {
    position: absolute;
    /* Out to the inside edge of the progress ring (r 46 - 2 of 50). */
    inset: 6%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle, transparent 0 44%, rgba(255, 255, 255, 0.06) 45%, transparent 47%),
      repeating-radial-gradient(circle, #121214 0 2px, #1d1d21 2px 3px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    animation: spin 5s linear infinite;
  }

  .is-paused .record { animation-play-state: paused; }

  .record .art {
    position: absolute;
    width: 45%;
    height: 45%;
    border-radius: 50%;
  }

  .record .art-fallback { font-size: 16px; }

  .record .hole {
    display: block;
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0b0b0d;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Next up and the request line (every style) ------------------------- */

  .next {
    width: var(--width);
    padding: 8px 12px 9px;
    border-radius: 12px;
    background: var(--chip);
    border: 1px solid var(--line);
  }

  .next-label {
    font: 600 10px 'Saira Semi Condensed', sans-serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 3px;
  }

  .next-item {
    display: flex;
    gap: 8px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }

  .next-num {
    width: 12px;
    flex: 0 0 auto;
    color: var(--dim);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .next-song {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .next-song span { color: var(--muted); }

  .next-who {
    flex: 0 0 auto;
    max-width: 36%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--twitch);
    font-size: 12px;
  }

  .hint {
    align-self: flex-start;
    max-width: var(--width);
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--chip);
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--twitch);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* A new song slides in. */
  .bump { animation: bump 520ms ease; }

  @keyframes bump {
    0% { opacity: 0; transform: translateX(-14px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee.scrolling > span, .pulse, .bump, .record { animation: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="root" data-style="default">
      <div class="card" id="card">
        <div class="backdrop" id="backdrop"></div>
        <div class="pill-fill" id="pill-fill"></div>
        <div class="pill-line"><div class="marquee" id="pill"><span></span></div></div>
        <div class="art-wrap">
          <div class="art art-fallback"></div>
          <img class="art" alt="" hidden />
        </div>
        <div class="disc">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-track" cx="50" cy="50" r="46" fill="none" stroke-width="4" />
            <circle class="ring-fill" id="ring-fill" cx="50" cy="50" r="46" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 289.03" />
          </svg>
          <div class="record">
            <div class="art art-fallback"></div>
            <img class="art" alt="" hidden />
            <div class="hole"></div>
          </div>
          <div class="ring-arm" id="ring-arm"><span class="knob"></span></div>
        </div>
        <div class="meta">
          <div class="label"><span class="pulse"></span><span id="label-text">Now playing</span></div>
          <div class="marquee title" id="title"><span></span></div>
          <div class="marquee sub" id="sub"><span></span></div>
          <div class="progress" id="progress" hidden>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
            <span class="knob" id="bar-knob"></span>
          </div>
        </div>
      </div>
      <div class="next" id="next" hidden>
        <div class="next-label">Next up</div>
        <div id="next-items"></div>
      </div>
      <div class="hint" id="hint" hidden></div>
    </div>
  </div>
  <div class="preview-note">Preview — in OBS this sits on top of your scene.</div>

<script>
(function () {
  'use strict'

  const $ = (id) => document.getElementById(id)
  const stage = $('stage')
  const root = $('root')
  const card = $('card')
  const backdrop = $('backdrop')
  const labelText = $('label-text')
  const titleEl = $('title')
  const subEl = $('sub')
  const pillEl = $('pill')
  const pillFill = $('pill-fill')
  const progress = $('progress')
  const progressFill = $('progress-fill')
  const barKnob = $('bar-knob')
  const ringFill = $('ring-fill')
  const ringArm = $('ring-arm')
  const nextEl = $('next')
  const nextItems = $('next-items')
  const hintEl = $('hint')
  const arts = Array.from(document.querySelectorAll('img.art'))
  const fallbacks = Array.from(document.querySelectorAll('.art-fallback'))
  const RING_LENGTH = 2 * Math.PI * 46

  const params = new URLSearchParams(location.search)
  const STYLES = ['default', 'compact', 'card', 'vinyl']
  const style = STYLES.includes(params.get('style')) ? params.get('style') : 'default'
  root.dataset.style = style
  if (params.has('preview')) document.body.classList.add('preview')
  // Inside the app's Overlay page: no "this is a preview" caption.
  if (params.has('embedded')) document.body.classList.add('embedded')
  // ?demo shows a sample song while nothing is playing, so a style can be
  // judged from the app's Overlay page at any time.
  const demo = params.has('demo')

  let lastTrackKey = ''
  let lastPayload = ''
  let hideTimer = null
  let popUpUntil = 0

  // Fading out the instant a state blip arrives would flicker on stream, so
  // hiding waits a beat while showing is immediate.
  function setVisible(visible) {
    if (visible) {
      if (hideTimer !== null) {
        clearTimeout(hideTimer)
        hideTimer = null
      }
      root.classList.add('visible')
      return
    }
    if (hideTimer === null && root.classList.contains('visible')) {
      hideTimer = setTimeout(function () {
        hideTimer = null
        root.classList.remove('visible')
      }, 2500)
    }
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  function initials(text) {
    const words = String(text || '').replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean)
    return (words.slice(0, 2).map((word) => word[0]).join('') || '♪').toUpperCase()
  }

  // Starts the drift only when the text is wider than its box, at a speed
  // that suits how far it has to travel.
  function fit(el) {
    const inner = el.firstElementChild
    el.classList.remove('scrolling')
    const overflow = inner.scrollWidth - el.clientWidth
    if (overflow > 1) {
      el.style.setProperty('--shift', -(overflow + 20) + 'px')
      el.style.setProperty('--duration', Math.max(8, (overflow + 20) / 22) + 's')
      el.classList.add('scrolling')
    }
  }

  function setMarquee(el, html) {
    const inner = el.firstElementChild
    if (inner.innerHTML === html) return
    inner.innerHTML = html
    fit(el)
  }

  // The Card style is meant to be sized freely in OBS (it suits Starting
  // Soon and BRB scenes): scale it to fill the source instead of cropping.
  function fitStage() {
    if (style !== 'card') return
    stage.style.transform = 'none'
    const scale = Math.min(window.innerWidth / root.offsetWidth, window.innerHeight / root.offsetHeight)
    stage.style.transform = Number.isFinite(scale) && scale > 0 ? 'scale(' + scale + ')' : ''
  }
  window.addEventListener('resize', fitStage)

  // ---- Colors from the album art ----------------------------------------

  // Picks the artwork's most vivid hue (weighted by how much of the cover it
  // covers), then sets its lightness so text and bars stay readable on the
  // dark card. Mostly grey covers get a neutral accent.
  function paletteFrom(image) {
    const size = 32
    const canvas = document.createElement('canvas')
    canvas.width = size
    canvas.height = size
    const context = canvas.getContext('2d', { willReadFrequently: true })
    context.drawImage(image, 0, 0, size, size)
    const pixels = context.getImageData(0, 0, size, size).data

    const bins = new Array(36).fill(null).map(() => ({ weight: 0, saturation: 0, hueSum: 0 }))
    let colorful = 0
    for (let index = 0; index < pixels.length; index += 4) {
      const r = pixels[index] / 255
      const g = pixels[index + 1] / 255
      const b = pixels[index + 2] / 255
      const max = Math.max(r, g, b)
      const min = Math.min(r, g, b)
      const lightness = (max + min) / 2
      const chroma = max - min
      if (chroma < 0.08 || lightness < 0.1 || lightness > 0.94) continue
      const saturation = chroma / (1 - Math.abs(2 * lightness - 1))
      let hue
      if (max === r) hue = ((g - b) / chroma) % 6
      else if (max === g) hue = (b - r) / chroma + 2
      else hue = (r - g) / chroma + 4
      hue = (hue * 60 + 360) % 360
      const weight = saturation * (1 - Math.abs(lightness - 0.5))
      const bin = bins[Math.floor(hue / 10)]
      bin.weight += weight
      bin.saturation += saturation * weight
      bin.hueSum += hue * weight
      colorful += 1
    }

    if (colorful < (size * size) / 25) {
      return { accent: 'hsl(30 12% 80%)', soft: 'hsl(30 6% 16%)', tint: 'hsl(30 6% 10% / 0.92)' }
    }
    let best = bins[0]
    for (const bin of bins) if (bin.weight > best.weight) best = bin
    const hue = Math.round(best.hueSum / best.weight)
    const saturation = Math.min(90, Math.max(45, Math.round((best.saturation / best.weight) * 100)))
    return {
      accent: 'hsl(' + hue + ' ' + saturation + '% 66%)',
      soft: 'hsl(' + hue + ' ' + Math.min(saturation, 40) + '% 18%)',
      tint: 'hsl(' + hue + ' ' + Math.min(saturation, 35) + '% 10% / 0.92)',
    }
  }

  let colorsFor = ''
  function applyColors(url, enabled) {
    const key = enabled ? url || '' : ''
    if (key === colorsFor) return
    colorsFor = key
    if (!key) {
      root.style.removeProperty('--accent')
      root.style.removeProperty('--accent-soft')
      root.style.removeProperty('--tint')
      return
    }
    // A separate image with CORS on, so a server without it can't break the
    // artwork that's on screen; Apple's artwork server allows it.
    const probe = new Image()
    probe.crossOrigin = 'anonymous'
    probe.onload = function () {
      if (colorsFor !== key) return
      try {
        const colors = paletteFrom(probe)
        root.style.setProperty('--accent', colors.accent)
        root.style.setProperty('--accent-soft', colors.soft)
        root.style.setProperty('--tint', colors.tint)
      } catch (_) {
        // The image couldn't be read: keep the standard colors.
      }
    }
    probe.src = url
  }

  // ---- Rendering -----------------------------------------------------------

  function sampleArt() {
    const canvas = document.createElement('canvas')
    canvas.width = 120
    canvas.height = 120
    const context = canvas.getContext('2d')
    context.fillStyle = '#1f3b5a'
    context.fillRect(0, 0, 120, 120)
    context.fillStyle = '#3f8fd6'
    context.beginPath()
    context.arc(78, 46, 34, 0, Math.PI * 2)
    context.fill()
    context.fillStyle = '#e4eef8'
    context.fillRect(14, 84, 92, 8)
    return canvas.toDataURL('image/png')
  }

  let demoArt = null
  function demoState(state) {
    demoArt = demoArt || sampleArt()
    return Object.assign({}, state, {
      playing: true,
      paused: false,
      title: 'Your song shows here',
      artist: 'Artist',
      artworkUrl: demoArt,
      requestedBy: 'viewer',
      requestedWithPoints: false,
      positionMs: 64000,
      durationMs: 200000,
      queue: [
        { title: 'Next request', artist: 'Another artist', requestedBy: 'someone' },
        { title: 'And one more', artist: 'Band', requestedBy: 'chatter' },
      ],
    })
  }

  // Moves every progress display to `percent`; without animating when the
  // song just changed (so it jumps back to the start instead of sliding).
  function setProgress(percent, jump) {
    const parts = [progressFill, barKnob, pillFill, ringFill, ringArm]
    if (jump) parts.forEach((part) => (part.style.transition = 'none'))
    progressFill.style.width = percent + '%'
    pillFill.style.width = percent + '%'
    barKnob.style.left = percent + '%'
    ringFill.setAttribute('stroke-dasharray', (RING_LENGTH * percent) / 100 + ' ' + RING_LENGTH)
    ringArm.style.transform = 'rotate(' + percent * 3.6 + 'deg)'
    if (jump) {
      void card.offsetWidth
      parts.forEach((part) => (part.style.transition = ''))
    }
  }

  function render(state) {
    if (demo && !(state.playing && state.title)) {
      state = demoState(state)
    }
    const playing = !!state.playing && !!state.title
    root.classList.toggle('is-paused', !!state.paused)
    if (!playing) {
      lastTrackKey = ''
      setVisible(false)
      return
    }

    const trackKey = state.title + '|' + state.artist
    const newTrack = trackKey !== lastTrackKey
    if (newTrack) {
      lastTrackKey = trackKey
      popUpUntil = state.popUpSeconds > 0 ? Date.now() + state.popUpSeconds * 1000 : 0
      card.classList.remove('bump')
      void card.offsetWidth
      card.classList.add('bump')
    }

    const hiddenWhilePaused = state.paused && state.showWhilePaused === false
    const poppedDown = state.popUpSeconds > 0 && Date.now() > popUpUntil
    setVisible(!hiddenWhilePaused && !poppedDown)

    labelText.textContent = state.paused ? 'Paused' : 'Now playing'

    setMarquee(titleEl, escapeHtml(state.title))
    let sub = escapeHtml(state.artist)
    if (state.requestedBy) {
      sub +=
        ' <span class="sep">·</span> requested by <span class="who">@' + escapeHtml(state.requestedBy) + '</span>' +
        (state.requestedWithPoints ? '<span class="points">points</span>' : '')
    }
    setMarquee(subEl, sub)
    // Compact: the title as Apple writes it, in bold, then the artist in
    // capitals. No requester; there's no room.
    setMarquee(
      pillEl,
      '<span class="pill-title">' + escapeHtml(state.title) + '</span>' +
        (state.artist ? '<span class="pill-artist">' + escapeHtml(state.artist) + '</span>' : ''),
    )

    for (const art of arts) {
      if (state.artworkUrl) {
        if (art.getAttribute('src') !== state.artworkUrl) art.setAttribute('src', state.artworkUrl)
        art.hidden = false
      } else {
        art.hidden = true
        art.removeAttribute('src')
      }
    }
    for (const fallback of fallbacks) {
      fallback.hidden = !!state.artworkUrl
      fallback.textContent = initials(state.title)
    }
    if (state.artworkUrl) {
      backdrop.style.setProperty('--art-url', 'url("' + state.artworkUrl.replace(/"/g, '%22') + '")')
    } else {
      backdrop.style.removeProperty('--art-url')
    }
    applyColors(state.artworkUrl, state.artColors !== false)

    if (state.durationMs && state.positionMs != null) {
      progress.hidden = false
      setProgress(Math.min(100, (state.positionMs / state.durationMs) * 100), newTrack)
    } else {
      progress.hidden = true
      setProgress(0, true)
    }

    const queue = Array.isArray(state.queue) ? state.queue : []
    if (state.showQueue && queue.length > 0) {
      nextItems.innerHTML = queue
        .map(function (item, index) {
          const artist = item.artist ? ' <span>— ' + escapeHtml(item.artist) + '</span>' : ''
          const who = item.requestedBy ? '<span class="next-who">@' + escapeHtml(item.requestedBy) + '</span>' : ''
          return (
            '<div class="next-item"><span class="next-num">' + (index + 1) + '</span>' +
            '<span class="next-song">' + escapeHtml(item.title) + artist + '</span>' + who + '</div>'
          )
        })
        .join('')
      nextEl.hidden = false
    } else {
      nextEl.hidden = true
    }

    if (state.hint) {
      hintEl.textContent = state.hint
      hintEl.hidden = false
    } else {
      hintEl.hidden = true
    }

    fitStage()
  }

  async function poll() {
    try {
      const response = await fetch('/state', { cache: 'no-store' })
      const text = await response.text()
      // Skip the DOM work when nothing changed, unless a pop-up is due to
      // end (that depends on the clock, not the state).
      const popUpDue = popUpUntil > 0 && Date.now() > popUpUntil && root.classList.contains('visible')
      if (text !== lastPayload || popUpDue) {
        lastPayload = text
        render(JSON.parse(text))
      }
    } catch (_) {
      // App closed or restarting: keep the last frame and retry.
    }
  }

  // Text widths change once the fonts arrive.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      fit(titleEl)
      fit(subEl)
      fit(pillEl)
      fitStage()
    })
  }

  poll()
  setInterval(poll, 1000)
})();
</script>
</body>
</html>
